replicaCount: 2

image:
  repository: ghcr.io/seunnuga93/inventory-api
  # Overwritten by CI on every merge to main (see .github/workflows/ci.yml).
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations: {}

service:
  type: ClusterIP
  port: 80

containerPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: false
  className: nginx
  host: inventory.example.com
  tls: false

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: false
  interval: 30s

podAnnotations: {}
