apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inventory-api-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/seunnuga93/k8s-microservice-gitops.git
    targetRevision: main
    path: charts/inventory-api
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: inventory-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
